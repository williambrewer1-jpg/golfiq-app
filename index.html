<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GolfIQ">
<meta name="theme-color" content="#1b5e20">
<title>GolfIQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#16211a;--muted:#5f6b63;--line:#dfe5e0;--accent:#1b5e20;--accent2:#2e7d32;--good:#2e7d32;--bad:#c62828;--warn:#b26a00;--chip:#e8efe9;--plotbg:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--card:#18201b;--ink:#e6efe8;--muted:#9aa89f;--line:#2a352e;--accent:#66bb6a;--accent2:#81c784;--good:#66bb6a;--bad:#ef5350;--warn:#ffb74d;--chip:#223028;--plotbg:#18201b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:18px;padding:7px 12px;font:600 14px inherit}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;text-align:center;padding:8px 0 6px;color:var(--muted);text-decoration:none;font-size:11px}
nav.bottom a span{display:block;font-size:20px;line-height:24px}nav.bottom a.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 10px}.card h3{font-size:14px;margin:12px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:650}.kpi .d{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.warn{background:rgba(255,183,77,.15);border:1px solid rgba(255,183,77,.5);border-radius:10px;padding:10px;font-size:13px;margin:0 0 10px}
.err{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.45);border-radius:10px;padding:10px;font-size:13px;margin:0 0 10px}
.ok{background:rgba(102,187,106,.13);border:1px solid rgba(102,187,106,.45);border-radius:10px;padding:10px;font-size:13px;margin:0 0 10px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--card)}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
tr.click{cursor:pointer}tr.click:active td{background:var(--chip)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin:0 0 10px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:7px 8px;border-radius:8px;font:500 13px inherit;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:650}
select,input,textarea{font:16px inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
textarea{width:100%;font:12px ui-monospace,Menlo,monospace}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 15px inherit;text-decoration:none;margin:4px 6px 4px 0}
.btn.sec{background:var(--chip);color:var(--ink)}.btn.danger{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.plot{width:100%;min-height:260px}.plot.tall{min-height:420px}.plot.map{min-height:460px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.list a{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
.list a span{font-size:22px;width:30px;text-align:center}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none}.sheet.open{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;background:var(--chip);color:var(--muted)}
.badge.reliable{background:rgba(102,187,106,.2);color:var(--good)}.badge.low{background:rgba(255,183,77,.2);color:var(--warn)}.badge.insufficient{background:rgba(239,83,80,.15);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.finding h3{margin:0 0 6px;font-size:16px}.finding ul{margin:6px 0;padding-left:18px}.finding li{margin:3px 0;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;background:#263238;color:#fff;border-radius:12px;padding:12px;font-size:14px;display:none}
</style>
</head>
<body>
<header><h1 id="title">GolfIQ</h1><button id="filterBtn" hidden>Filters</button></header>
<main id="main"><div class="card">Loading…</div></main>
<nav class="bottom" id="nav"></nav>
<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" defer></script>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
